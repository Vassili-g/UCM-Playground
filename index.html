<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCM Playground</title>
    <!--
      Kit FontAwesome — intégration CÔTÉ APPLICATION (pas dans le contrat ni
      dans Unified Component Exporter). Les contrats de composant ne stockent qu'un NOM d'icône opaque
      (ex. « arrow-left-long ») ; c'est ce kit qui le résout en glyphe réel,
      y compris pour les icônes personnalisées du kit.

      L'identifiant vient de l'environnement (Vite substitue « %VITE_…% » ici) :
      un kit ID est rattaché à un compte FontAwesome, il n'a pas à être écrit
      en clair dans un dépôt. Copier `.env.example` en `.env.local` et y mettre
      le sien. Sans variable, les icônes ne s'affichent pas — c'est attendu,
      comme lorsque le kit est absent.
    -->
    <script src="https://kit.fontawesome.com/%VITE_FA_KIT_ID%.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
