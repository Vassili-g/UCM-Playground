# Garde-fous C1/C2 (cf. UCM-Exporter/ROADMAP.md) : chaque token référencé par
# un contrat doit exister dans les tokens générés ; un contrat peut précéder
# son `.tsx`, mais toute implémentation déjà présente doit suivre le contrat.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nécessaire pour publier le diagnostic en commentaire de pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Le job installe et exécute le code de la pull request. Il n'a aucune
      # raison de garder un jeton git utilisable : le commentaire de PR passe
      # par GITHUB_TOKEN, pas par les identifiants du checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Le diff avec la base délimite les messages informatifs de la PR.
          fetch-depth: 0

      - name: Relever les contrats modifiés par la pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo 'UCM_CONTRATS_MODIFIES<<EOF'
            git diff --name-only "$BASE_SHA" HEAD -- ':(glob)src/**/*.contract.json'
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Le rapport écrit par check-contract est publié sur la PR : le designer
      # qui valide un export lit le diagnostic sans ouvrir les logs de CI.
      # `always()` car l'essentiel est justement de commenter les échecs.
      - name: Publier le diagnostic sur la pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('ci-report.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.number }}
        # --edit-last met à jour le commentaire précédent au lieu d'empiler un
        # nouveau à chaque push ; s'il n'en existe pas encore, on en crée un.
        run: |
          gh pr comment "$NUMERO" --body-file ci-report.md --edit-last \
            || gh pr comment "$NUMERO" --body-file ci-report.md
