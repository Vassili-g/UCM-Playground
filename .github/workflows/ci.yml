# Garde-fou C1 (cf. UCM-Exporter/ROADMAP.md) : chaque token référencé par un
# contrat doit exister dans les tokens générés, et le playground doit compiler.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
