# Garde-fous du consommateur (cf. UCM-Exporter/ROADMAP.md) : les tokens DTCG
# font foi et les anciennes références des contrats sont signalées sans bloquer ;
# un contrat peut précéder son `.tsx`, et une implémentation déjà présente qui
# s'en écarte est signalée sans bloquer elle aussi — ce que l'export ne peut ni
# causer ni corriger ne refuse pas la pull request qui le porte.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nécessaire pour publier le diagnostic en commentaire de pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Le job installe et exécute le code de la pull request. Il n'a aucune
      # raison de garder un jeton git utilisable : le commentaire de PR passe
      # par GITHUB_TOKEN, pas par les identifiants du checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Le diff avec la base délimite les messages informatifs de la PR.
          fetch-depth: 0

      # Le clone frère, et il n'est pas un confort de confort : une bonne partie
      # de la documentation de ce repository renvoie vers `../UCM-Exporter`, où
      # vit l'autorité sur le format. `liens-documents.test.mjs` vérifie ces
      # renvois, et il EXIGE le voisin plutôt que de sauter les liens qu'il ne
      # peut pas suivre — un contrôle qui saute ce qu'il ne voit pas se lit vert
      # précisément dans le cas qu'il existe pour couvrir.
      #
      # `main` du voisin, et pas un commit apparié : c'est ce qu'un lecteur
      # trouve en suivant le lien.
      - name: Cloner le repository frère
        run: git clone --depth 1 https://github.com/Vassili-g/UCM-Exporter.git ../UCM-Exporter

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrôler les contrats et la stack
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check
      - id: build
        run: npm run build

      - name: Publier le rapport dans le résumé du run
        if: always() && hashFiles('ci-report.md') != ''
        run: cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      # La construction est le seul contrôle qui reste hors du rapport : elle
      # ne peut pas s'y ajouter avant d'avoir eu lieu. Un TypeScript qui ne
      # compile plus refuserait donc la pull request sous un rapport vert.
      - name: Signaler une construction en échec dans le rapport
        if: always() && github.event_name == 'pull_request' && steps.build.outcome == 'failure'
        run: |
          cat >> ci-report.md <<'EOF'

          ### 🧱 Le code React ne compile plus

          Les contrats et les tokens ci-dessus sont en ordre, mais le repository ne se construit pas. **Votre design n'est pas en cause**, et ré-exporter n'y changerait rien.

          **Action attendue :** un développeur doit corriger la compilation dans cette pull request.
          EOF

      # Dernier filet : si le rapport manque, c'est que la CI s'est arrêtée
      # avant `ucm check` (installation, checkout, plantage du garde-fou).
      # Une pull request refusée sans un mot laisse le designer sans recours ;
      # ce message minimal nomme au moins l'endroit où regarder.
      - name: Garantir un diagnostic même sans rapport
        if: always() && github.event_name == 'pull_request' && hashFiles('ci-report.md') == ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > ci-report.md <<EOF
          ## ❌ La vérification n'a pas pu rendre son diagnostic

          Les contrôles se sont arrêtés avant d'avoir pu analyser cet export : le rapport habituel n'a pas été produit. **Votre design n'est pas en cause** et ré-exporter depuis Figma n'y changerait rien.

          **Action attendue :** un développeur doit ouvrir [l'exécution de la CI]($RUN_URL) pour en connaître la raison.
          EOF

      # Le rapport écrit par `ucm check` est publié sur la PR : le designer
      # qui valide un export lit le diagnostic sans ouvrir les logs de CI.
      # `always()` car l'essentiel est justement de commenter les échecs.
      - name: Publier le diagnostic sur la pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('ci-report.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.number }}
        # --edit-last met à jour le commentaire précédent au lieu d'empiler un
        # nouveau à chaque push ; s'il n'en existe pas encore, on en crée un.
        run: |
          gh pr comment "$NUMERO" --body-file ci-report.md --edit-last \
            || gh pr comment "$NUMERO" --body-file ci-report.md
